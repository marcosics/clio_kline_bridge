; Puente linea K <-> PC/Android. Ver CLAUDE.md seccion 8.
; pio run -e esp32 -t upload && pio device monitor -e esp32
[env]
framework = arduino
monitor_speed = 115200

; Hotspot del móvil (opcional): el puente se une a él además de crear su red CLIO-KLINE.
; Pon aquí el nombre y la clave de la zona wifi del teléfono y quita el ; de la línea flags.
[movil]
flags =
;flags = -DSTA_SSID=\"NombreWifiMovil\" -DSTA_PASS=\"ClaveWifiMovil\"

; ESP32: K en UART2 (RX16/TX17), comandos por USB y por Wi-Fi (AP CLIO-KLINE, TCP :23)
[env:esp32]
platform = espressif32
board = esp32dev
build_flags = ${movil.flags}

; Segundo ESP32 que hace de UCE 0x7A simulada para el banco de pruebas
[env:esp32_ecusim]
platform = espressif32
board = esp32dev
build_flags = -DROLE_ECUSIM

; D1 mini: K en UART0 intercambiado (RX13/TX15), comandos solo por Wi-Fi
[env:d1mini]
platform = espressif8266
board = d1_mini
build_flags = -DBOARD_D1MINI ${movil.flags}

; ESP-01: K en GPIO1/3, comandos solo por Wi-Fi. GPIO2 habilita el TX del transceptor (activo en bajo)
[env:esp01]
platform = espressif8266
board = esp01_1m
build_flags = -DKTX_GATE_PIN=2 ${movil.flags}

; Arduino Uno: K por AltSoftSerial (RX8/TX9), comandos por USB. Solo pruebas
[env:uno]
platform = atmelavr
board = uno
lib_deps = paulstoffregen/AltSoftSerial
