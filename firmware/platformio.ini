; Puente línea K <-> PC/Android (firmware 2.x). Ver CLAUDE.md sec. 8 y firmware/LEEME.md.
;   python -m platformio run -e esp01 -t upload          (con el adaptador USB-ESP01)
;   python -m platformio run -e esp01_ota -t upload      (por wifi, sin sacar el ESP de la placa)
;   python -m platformio run -e native                   (el mismo firmware en el PC, con línea K virtual)

; Hotspot del móvil (opcional): valor por defecto al grabar. También se cambia sin recompilar:
;   telnet clio-kline.local 23  ->  WIFI NombreWifi ClaveWifi
[movil]
flags =
;flags = -DSTA_SSID=\"NombreWifiMovil\" -DSTA_PASS=\"ClaveWifiMovil\"

[esp]
framework = arduino
monitor_speed = 115200
build_src_filter = +<core/> +<platform/esp_main.cpp>

; ESP-01: K en GPIO1/3 (su único UART), comandos solo por wifi. GPIO2 = puerta del TX (activa en bajo).
[env:esp01]
extends = esp
platform = espressif8266
board = esp01_1m
board_build.ldscript = eagle.flash.1m64.ld
build_flags = -DBOARD_ESP01 -DKTX_GATE_PIN=2 ${movil.flags}

; Igual pero grabando por wifi (OTA). Clave OTA = la de la red propia (AP_PASS, por defecto clio1234).
[env:esp01_ota]
extends = env:esp01
upload_protocol = espota
upload_port = clio-kline.local
upload_flags = --auth=clio1234

; D1 mini / ESP-12: K en UART0 intercambiado (RX13/TX15), comandos por wifi; log por Serial1 (GPIO2, 115200)
[env:d1mini]
extends = esp
platform = espressif8266
board = d1_mini
build_flags = -DBOARD_D1MINI ${movil.flags}

; ESP32: K en UART2 (RX16/TX17), comandos por USB (115200) y por wifi
[env:esp32]
extends = esp
platform = espressif32
board = esp32dev
build_flags = -DBOARD_ESP32 ${movil.flags}

; Segundo ESP32 que hace de UCE 0x7A/0x26/0x28 simulada para el banco de pruebas
[env:esp32_ecusim]
extends = esp
platform = espressif32
board = esp32dev
build_flags = -DBOARD_ESP32 -DROLE_ECUSIM

; Arduino Uno: K por AltSoftSerial (RX8/TX9), comandos por USB. Solo pruebas (sin wifi)
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps = paulstoffregen/AltSoftSerial
build_src_filter = +<core/> +<platform/uno_main.cpp>

; El mismo núcleo en el PC con línea K virtual y UCE simuladas (pruebas con la web, sin placa)
[env:native]
platform = native
build_flags = -DNATIVE -std=gnu++17 -O1 -Wall
build_src_filter = +<core/> +<platform/native_main.cpp>
