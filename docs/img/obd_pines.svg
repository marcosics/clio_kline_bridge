<text x="360.0" y="360.0" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#222" text-anchor="start" font-weight="bold">Cable al puente</text>
<rect x="58" y="375" width="40" height="22" rx="4" fill="#222222"/>
<text x="78.0" y="391.0" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
<text x="130.0" y="390.0" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#222" text-anchor="start" font-weight="normal">Masa de chasis</text>
<text x="360.0" y="390.0" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#222" text-anchor="start" font-weight="normal">negro</text>
<rect x="58" y="403" width="40" height="22" rx="4" fill="#222222"/>
<text x="78.0" y="419.0" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">5</text>
<text x="130.0" y="418.0" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#222" text-anchor="start" font-weight="normal">Masa de señal</text>
<text x="360.0" y="418.0" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#222" text-anchor="start" font-weight="normal">negro</text>
<rect x="58" y="431" width="40" height="22" rx="4" fill="#e9c46a"/>
<text x="78.0" y="447.0" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">7</text>
<text x="130.0" y="446.0" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#222" text-anchor="start" font-weight="normal">Línea K (UCE A-B4)</text>
<text x="360.0" y="446.0" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#222" text-anchor="start" font-weight="normal">amarillo</text>
<rect x="58" y="459" width="40" height="22" rx="4" fill="#d62828"/>
<text x="78.0" y="475.0" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">16</text>
<text x="130.0" y="474.0" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#222" text-anchor="start" font-weight="normal">+12 V permanente</text>
<text x="360.0" y="474.0" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#222" text-anchor="start" font-weight="normal">rojo, con F1 1 A</text>
<text x="60.0" y="520.0" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#444" text-anchor="start" font-weight="normal">Resto de pines: NO conectar. En el Clio II no hay CAN de diagnóstico (6/14) y la línea L (15) no hace falta.</text>
<text x="60.0" y="575.0" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#111" text-anchor="start" font-weight="bold">Sin conector macho: pin hecho con cable rígido de 1,5 mm² (el de la instalación de casa)</text>
<rect x="80" y="632" width="60" height="16" fill="#c87533" stroke="#7a4317"/>
<text x="110.0" y="622.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="normal">1 cm pelado</text>
<rect x="140" y="629" width="50" height="22" rx="4" fill="#2b2b2b"/>
<text x="165.0" y="670.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="normal">termorretráctil</text>
<rect x="190" y="634" width="200" height="12" rx="6" fill="#e9c46a"/>
<text x="290.0" y="670.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="normal">soldado al cable del puente</text>
<rect x="410" y="618" width="140" height="44" rx="6" fill="#555"/>
<text x="480.0" y="644.0" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">a la placa</text>
<line x1="390" y1="640" x2="410" y2="640" stroke="#e9c46a" stroke-width="10"/>
<text x="60.0" y="710.0" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#222" text-anchor="start" font-weight="normal">• Hacer 4 pines (4, 5, 7, 16) y unirlos con cinta o un trozo de plástico para que no se crucen.</text>
<text x="60.0" y="734.0" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#222" text-anchor="start" font-weight="normal">• Orden: masas 4 y 5 → K 7 → +12 V 16 el último. Si el 16 toca masa salta el fusible del coche.</text>
<text x="60.0" y="758.0" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#222" text-anchor="start" font-weight="normal">• Los Dupont macho de 0,64 mm bailan en la toma: por delante no; por detrás (pinchando el cable) sí.</text>
<text x="60.0" y="782.0" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#222" text-anchor="start" font-weight="normal">• En el Clio II la toma está en la consola central, delante de la palanca de cambios (detrás de la tapa).</text>
<text x="60.0" y="806.0" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#222" text-anchor="start" font-weight="normal">• Comprobar antes con el polímetro: 16-4 = tensión de batería; 7-4 ≈ 10-12 V con el contacto puesto.</text>
</svg>
