<text x="900.0" y="548.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#444" text-anchor="start" font-weight="normal">Comprueba GND con el polímetro: tiene continuidad con la tapa metálica.</text>
<text x="900.0" y="566.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#444" text-anchor="start" font-weight="normal">Si la tuya sale al revés, gira el dibujo: lo que cuenta son las parejas.</text>
